
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <header>
            <h1>🎮 Tic Tac Toe</h1>
            <p>Challenge your friend or play against CPU!</p>
        </header>

        <!-- GAME SETTINGS -->

        <div class="settings">

            <div class="setting-group">
                <label for="gameMode">Game Mode</label>

                <select id="gameMode">
                    <option value="two">2 Players</option>
                    <option value="cpu">Human vs CPU</option>
                </select>
            </div>

            <div class="setting-group hidden" id="difficultyBox">
                <label for="difficulty">CPU Difficulty</label>

                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>

            <div class="setting-group">
                <label for="winningScore">Winning Score</label>

                <select id="winningScore">
                    <option value="3">First to 3 Wins</option>
                    <option value="5">First to 5 Wins</option>
                    <option value="10">First to 10 Wins</option>
                </select>
            </div>

        </div>

        <!-- SCOREBOARD -->

        <h2 class="score-heading">🏆 Scoreboard</h2>

        <div class="scoreboard">

            <div class="score-card">
                <h3>Player X</h3>
                <span id="scoreX">0</span>
            </div>

            <div class="score-card">
                <h3 id="playerOLabel">Player O</h3>
                <span id="scoreO">0</span>
            </div>

            <div class="score-card">
                <h3>Draws</h3>
                <span id="drawScore">0</span>
            </div>

        </div>

        <!-- TOURNAMENT PROGRESS -->

        <div class="tournament-progress">
            <p>🏆 Wins needed to become Champion</p>

            <div class="progress-info">
                <span>Player X: <b id="remainingX">3</b></span>
                <span>Player O: <b id="remainingO">3</b></span>
            </div>
        </div>

        <!-- GAME STATUS -->

        <div class="status" id="status">
            Player X's Turn
        </div>

        <!-- GAME BOARD -->

        <div class="board" id="board">

            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>

            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>

            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>

        </div>

        <!-- ROUND RESULT -->

        <div id="resultMessage" class="result-message hidden"></div>

        <!-- TOURNAMENT WINNER -->

        <div id="tournamentMessage" class="tournament-message hidden"></div>

        <!-- BUTTONS -->

        <div class="buttons">

            <button id="newGameBtn">
                🔄 New Game
            </button>

            <button id="resetBtn">
                🗑 Reset Scores
            </button>

        </div>

        <footer>
            <p>Made with ❤️ using HTML, CSS & JavaScript</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
